name: sound_drop
description: 時間差・位置情報連動型の音声ドロップアプリ（MVPプロトタイプ）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2           # 地図表示（OpenStreetMap・APIキー不要）
  latlong2: ^0.9.1             # 緯度経度（flutter_map用）
  geolocator: ^11.0.0           # 現在地取得・距離計算
  provider: ^6.1.2              # 状態管理
  just_audio: ^0.9.40           # 音声再生
  record: ^6.0.0                # 音声録音（振幅ストリーム対応。5.x系は記録パッケージの版ズレでビルド不可）
  path_provider: ^2.1.4         # 録音ファイルの保存先取得
  shared_preferences: ^2.3.2    # 投稿・所持チケット等の永続化
  in_app_purchase: ^3.2.0       # ワープチケット/投げ銭の課金
  image_picker: ^1.1.2          # プロフィール画像の選択
  url_launcher: ^6.3.0          # 出金オンボーディング等の外部URL起動
  # ---- バックエンド（USE_FIREBASE=true で使用。flutterfire configure 必須）----
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1  # アプリアイコン生成
  flutter_native_splash: ^2.4.1    # 起動スプラッシュ生成

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  # - assets/audio/   # 録音音声を扱う場合に有効化

# アプリアイコン生成（`dart run flutter_launcher_icons`）
# ★ あなたのPNGをそのまま使う設定:
#   assets/icon/app_icon_custom.png を上書き保存すれば全プラットフォームに反映されます。
#   （tool/generate_icon.js は app_icon_custom.png を生成しないので上書きされません）
# Android Adaptive のみ OS 側で角を丸くマスクするため、枠が切れにくいよう
# フレーム無し前景 app_icon_foreground.png を使用（必要なら custom に変更可）。
flutter_launcher_icons:
  image_path: "assets/icon/app_icon_custom.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#1D2A4C"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon_custom.png"
    background_color: "#1D2A4C"
    theme_color: "#1D2A4C"

# 起動スプラッシュ生成（`dart run flutter_native_splash:create`）
# フレーム付きフルアイコンに統一（背景ネイビーに溶け込み、枠＋モチーフが映える）。
flutter_native_splash:
  color: "#1D2A4C"
  image: "assets/icon/app_icon_custom.png"
  android_12:
    color: "#1D2A4C"
    image: "assets/icon/app_icon_custom.png"
  ios: true
  android: true
