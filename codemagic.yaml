# Codemagic で iOS をビルドして TestFlight へ配信する設定（Mac 不要）。
# 使い方は docs/ios_codemagic.md を参照。
#
# 前提:
#  - Codemagic の「Developer Portal」に登録済みの App Store Connect API キー
#    （名前: N9Q53984B7）を参照する。別キーを使う場合は下の名前を変更。
#  - App Store Connect でアプリ（Bundle ID: com.nicchizu.soundDrop）を作成済み。
#  - 署名は自動（automatic）。証明書・プロビジョニングは API キーから自動取得。

workflows:
  ios-beta:
    name: SounDrop iOS β (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic   # ← Codemagic に登録済みのAPIキー名（Name欄の値）
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter パッケージ取得
        script: flutter pub get
      - name: CocoaPods インストール
        script: find . -name "Podfile" -execdir pod install \;
      - name: Code signing（既存証明書を再利用。無ければ新規作成）
        script: |
          set -ex
          keychain initialize
          # まず既存の署名ファイル（前回このパイプラインが --save で保存した
          # 証明書＋秘密鍵）の再利用を試みる。ここで毎回 certificates create すると
          # Apple 側の配布証明書の上限に達して 409 エラーになるため、
          # 新規作成は「既存が見つからない場合のみ」に限定する。
          if app-store-connect fetch-signing-files "com.nicchizu.soundDrop" \
              --type IOS_APP_STORE; then
            echo "既存の署名ファイルを再利用しました"
          else
            echo "再利用できる証明書が無いため新規作成します"
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key.pem -q -N ""
            app-store-connect certificates create \
              --type IOS_DISTRIBUTION \
              --certificate-key=@file:/tmp/cert_key.pem \
              --save
            app-store-connect fetch-signing-files "com.nicchizu.soundDrop" \
              --type IOS_APP_STORE \
              --certificate-key=@file:/tmp/cert_key.pem \
              --create
          fi
          keychain add-certificates
          xcode-project use-profiles
      - name: IPA ビルド（β＝課金オフ / Firebase有効 / MapTiler本番タイル）
        script: |
          flutter build ipa --release \
            --dart-define=USE_FIREBASE=true \
            --dart-define=ENABLE_PURCHASES=false \
            --dart-define=MAPTILER_KEY=JmhDlC3XR4JapoU3OpNS \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true            # 自動で TestFlight に提出
        # 審査提出まで自動化したい場合は下を有効化（最初は手動が安全）:
        # submit_to_app_store: false
